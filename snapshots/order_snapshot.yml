snapshots:
  - name: orders_snapshot
    relation: source('jaffle_shop', 'orders')
    description: A snapshot of the orders table in the jaffle_shop database
    config:
      database: mtamascelli_prod
      schema: snapshot
      strategy: check
      unique_key: id
      check_cols: ['id', 'user_id', 'order_date', 'status']
      hard_deletes: ignore
